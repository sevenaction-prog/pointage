name: Build Cleanroom APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build clean release
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: sfl-consultpresence-cleanroom-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

      - name: Prepare apksigner
        run: |
          mkdir -p signing-tool
          cp $ANDROID_HOME/build-tools/35.0.0/apksigner signing-tool/apksigner
          cp $ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar signing-tool/apksigner.jar

      - name: Upload apksigner
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-35-cleanroom
          path: signing-tool
          if-no-files-found: error
          retention-days: 7
