name: Build SFL ConsultPresence Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Generate ephemeral release signing key
        shell: bash
        run: |
          KS_PASS="$(openssl rand -hex 18)"
          echo "::add-mask::$KS_PASS"
          echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"

          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore sfl-release-test.jks \
            -storepass "$KS_PASS" \
            -keypass "$KS_PASS" \
            -alias sflrelease \
            -keyalg RSA \
            -keysize 3072 \
            -validity 3650 \
            -dname "CN=SFL Consulting, OU=ConsultPresence, O=SFL Consulting, L=Liege, C=BE"

      - name: Sign release APK
        shell: bash
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks sfl-release-test.jks \
            --ks-key-alias sflrelease \
            --ks-pass env:KS_PASS \
            --out app/build/outputs/apk/release/SFL-ConsultPresence-v0.2-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify release signature
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs \
            app/build/outputs/apk/release/SFL-ConsultPresence-v0.2-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: sfl-consultpresence-v0.2-release
          path: app/build/outputs/apk/release/SFL-ConsultPresence-v0.2-release.apk
          if-no-files-found: error
          retention-days: 7
